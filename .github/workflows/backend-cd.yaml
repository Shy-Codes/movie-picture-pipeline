name: Backend Continuous Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - run: pip install pipenv

      - run: pipenv install --dev

      - run: pipenv run lint

  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - run: pip install pipenv

      - run: pipenv install --dev

      - run: pipenv run test

  build:
    runs-on: ubuntu-latest

    needs:
      - lint
      - test

    outputs:
      image: ${{ steps.image.outputs.image }}

    defaults:
      run:
        working-directory: starter/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - run: pip install pipenv

      - run: pipenv install --dev

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - uses: aws-actions/amazon-ecr-login@v2

      - id: image
        run: echo "image=${{ secrets.BACKEND_ECR_REPOSITORY }}:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build Docker Image
        run: docker build -t ${{ steps.image.outputs.image }} .

      - name: Push Docker Image
        run: docker push ${{ steps.image.outputs.image }}

  deploy:
    runs-on: ubuntu-latest

    needs:
      - build

    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v4

      - uses: imranismail/setup-kustomize@v2

      - working-directory: starter/backend/k8s
        run: |
          kustomize edit set image backend=${{ needs.build_and_deploy.outputs.image }}
          kustomize build | kubectl apply -f -